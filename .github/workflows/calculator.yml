name: Python Calculator CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # ---------------- CHECKOUT CODE ----------------

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # ---------------- SET UP PYTHON ----------------

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # ---------------- INSTALL DEPENDENCIES ----------------

      - name: Install Dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt

      # ---------------- PYTHON SYNTAX CHECK ----------------

      - name: Check Python Syntax
        run: |
          python -m py_compile calculator2.py

      # ---------------- BANDIT SECURITY SCAN ----------------

      - name: Bandit Security Scan
        run: |
          python -m bandit -r calculator2.py

      # ---------------- TEST SYMPY ----------------

      - name: Test SymPy Installation
        run: |
          python -c "import sympy; print('SymPy installed successfully')"

      # ---------------- SONARQUBE SECURITY SCAN ----------------

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ==========================================================
      # DOCKER BUILD
      # ==========================================================

      - name: Build Docker Image
        run: |
          docker build -t calculator-app .

      # ---------------- CREATE DOCKER NETWORK ----------------

      - name: Create Docker Network
        run: |
          docker network create zap-network

      # ---------------- RUN CALCULATOR APPLICATION ----------------

      - name: Run Calculator Application
        run: |
          docker run -d \
            --name calculator-app \
            --network zap-network \
            calculator-app

      # ---------------- WAIT FOR APPLICATION ----------------

      - name: Wait for Calculator Application
        run: |
          sleep 10
          docker ps

      # ==========================================================
      # OWASP ZAP DAST
      # ==========================================================

      - name: OWASP ZAP DAST Scan
        run: |
          docker run --rm \
            --network zap-network \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://calculator-app:5000 \
            -r zap-report.html \
            -J zap-report.json \
            -I

      # ---------------- UPLOAD ZAP REPORT ----------------

      - name: Upload OWASP ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report
          path: |
            zap-report.html
            zap-report.json

      # ---------------- CLEANUP ----------------

      - name: Stop Calculator Container
        if: always()
        run: |
          docker stop calculator-app || true
          docker rm calculator-app || true
          docker network rm zap-network || true

      # ---------------- BUILD SUCCESS ----------------

      - name: Build Successful
        run: |
          echo "Calculator application built and security tested successfully!!"
