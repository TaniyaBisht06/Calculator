name: Python Calculator CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Dependencies
        run: |
          bandit -r calculator2.py
          python -m pip install pip==26.2.1
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --requirement requirements.lock

      - name: Check Python Syntax
        run: python -m py_compile calculator2.py

      - name: Test SymPy Installation
        run: python -c "import sympy; print('SymPy installed successfully')"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Successful
        run: echo "Calculator application built successfully!!"
